# Nobody picks a version. release-please reads the Conventional Commits that
# land on main and keeps a release pull request open carrying the next
# version and the changelog entry, bumping [project].version in
# pyproject.toml; merging that pull request tags the release and writes the
# notes. That tag then drives publishing a Docker image to GHCR
# (rules/cli.md: every CLI tool ships one alongside its native package) —
# nothing here publishes to PyPI, since that's not wired up yet.
name: release

on:
  push:
    branches: [main]
  # A merge performed with the default GITHUB_TOKEN — which is what
  # arms *-auto-merge.yml's `gh pr merge --auto` — never fires this
  # workflow's own `push` trigger: GitHub suppresses events caused by
  # GITHUB_TOKEN specifically to stop recursive runs, and that
  # suppression covers the merge commit an auto-merged PR produces,
  # not just a workflow's own direct push. Confirmed live: merging the
  # release-please PR for 0.6.0 via auto-merge landed the commit on
  # main with zero check-runs and zero statuses — this workflow simply
  # never ran. workflow_dispatch is the manual escape hatch until
  # *-auto-merge.yml carries a real-identity token instead.
  workflow_dispatch:

permissions:
  contents: read

# Never two releases at once, and never cancel one halfway: a killed run can
# leave a tag pushed and the release notes half-written.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # tags the release and writes it
      pull-requests: write # keeps the release pull request up to date
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker-publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # pushes the image to GHCR
      attestations: write # attaches build provenance to the pushed image
      id-token: write # required for the attestation's keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          context: .
          push: true
          tags: |
            ghcr.io/alrayyes/movie-planner:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/alrayyes/movie-planner:latest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/alrayyes/movie-planner
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Builds and install-tests the .deb/.rpm — the reusable workflow
  # itself asks for nothing beyond a checkout's default `contents:
  # read`, since a job that only calls a reusable workflow can't grant
  # it more than this workflow's own top-level permissions without
  # GitHub rejecting the whole file at parse time. package-linux-publish
  # below does the part that needs elevated permissions, as a plain job.
  package-linux:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/package-linux.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}

  package-linux-publish:
    needs: [release-please, package-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # uploads the release assets
      attestations: write # attaches build provenance to them
      id-token: write # required for the attestation's keyless signing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: dist-pyinstaller
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist-pyinstaller/movie-planner_*.deb,dist-pyinstaller/movie-planner-*.rpm"
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            dist-pyinstaller/movie-planner_*.deb \
            dist-pyinstaller/movie-planner-*.rpm \
            --repo "$GITHUB_REPOSITORY"

  # Bumps this repo's own PKGBUILD to the new version, test-builds it
  # for real against the actual release tarball (not a local stand-in
  # the way ci.yml's dry run uses), and only then pushes to the
  # separate, personally-owned AUR git repo. AUR has no per-package
  # deploy keys — AUR_SSH_KEY is a shared key already used by other
  # repos, scoped by AUR's own maintainer list on the movie-planner
  # package, not by the key itself.
  aur-package:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      # See ci.yml's aur job for why this has to happen before
      # checkout, not just before the steps that call git directly.
      - name: Bootstrap git for checkout
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Install build tooling
        run: |
          pacman -Sy --noconfirm --needed \
            base-devel openssh sudo man-db \
            python-build python-installer python-wheel python-uv-build \
            python-caldav python-httpx python-icalendar python-rapidfuzz python-typer
          # See ci.yml's aur job for why this line is removed.
          sed -i '/^NoExtract.*man/d' /etc/pacman.conf
          # See ci.yml's aur job for why this is needed in a
          # `container:` job specifically.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

      - name: Bump pkgver and the release-tarball checksum
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          pkgver="${TAG_NAME##*-v}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/${TAG_NAME}.tar.gz"
          sha256=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          sed -i \
            -e "s/^pkgver=.*/pkgver=${pkgver}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('${sha256}')/" \
            PKGBUILD

      - name: Install AUR-only build dependencies
        run: su builder -c "bash '$GITHUB_WORKSPACE/scripts/install-aur-builddeps.sh'"

      - name: makepkg
        run: su builder -c "cd '$GITHUB_WORKSPACE' && makepkg -s --noconfirm --nocheck"

      # Same gate .deb/.rpm get in package-linux.yml: a package that
      # builds but doesn't install, or installs but doesn't run, is
      # otherwise only ever caught by an AUR user filing a comment.
      - name: Install-test the built package
        run: |
          pacman -U --noconfirm "$GITHUB_WORKSPACE"/movie-planner-*-1-any.pkg.tar.zst
          movie-planner --help
          man -w movie-planner

      - name: Push to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          su builder -c "
            set -eu
            mkdir -p ~/.ssh
            echo \"\$AUR_SSH_KEY\" > ~/.ssh/aur
            chmod 600 ~/.ssh/aur
            # Fetched directly from aur.archlinux.org — AUR publishes
            # no separate fingerprint page to cross-check against, so
            # this is trust-on-first-use, pinned here rather than
            # re-trusted on every run.
            echo 'aur.archlinux.org ssh-rsa ' >> ~/.ssh/known_hosts
            echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' >> ~/.ssh/known_hosts
            export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o UserKnownHostsFile=~/.ssh/known_hosts'

            cd /tmp
            git clone ssh://aur@aur.archlinux.org/movie-planner.git aur-movie-planner
            cd aur-movie-planner
            cp '$GITHUB_WORKSPACE/PKGBUILD' .
            makepkg --printsrcinfo > .SRCINFO
            git config user.name 'movie-planner release job'
            git config user.email 'alrayyes@users.noreply.github.com'
            git add PKGBUILD .SRCINFO
            if ! git diff --cached --quiet; then
              git commit -m \"release ${{ needs.release-please.outputs.tag_name }}\"
              git push origin HEAD:master
            fi
          "
