# Deliberately ungated: a secret can be committed to any file, so there's no
# diff this is safe to skip for — no `paths:` filter, unlike prose.yml.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned like everything else. No Go toolchain here to `go install` it
  # with, so this is a release binary instead.
  GITLEAKS_VERSION: 8.30.1

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0, or there's no history to walk and the job passes
      # having scanned nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      # Scoped to branches and tags rather than every ref, matching
      # Ryankes.eu/main's ci.yml: GitHub keeps a permanent refs/pull/<n>/head
      # per pull request, which a rewritten history would still leave
      # pointing at pre-rewrite commits.
      - run: gitleaks git --redact --no-banner --log-opts="--branches --tags" .
