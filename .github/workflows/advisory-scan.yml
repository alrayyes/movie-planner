# The scan half of rules/dependencies.md: audit main and keep one open "Dependency advisories"
# issue that lists what's there. Daily for advisories published against pins that haven't
# moved, on a lockfile push so a merged fix closes the ticket at once, and by hand. An audit
# that errors (registry down) fails the job and leaves the ticket alone.
name: advisory-scan

on:
  schedule:
    - cron: "41 5 * * *"
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - pyproject.toml
      - uv.lock
      - .github/workflows/advisory-scan.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.7"
      # Pinned to a main commit of alrayyes/advisory-scan until its first release; re-pin then.
      - uses: alrayyes/advisory-scan@425418a63e80eb10142fbd2e82127b7ef3a51d68
        with:
          mode: scan
          # One command, one ticket: two steps sharing a title would close each other's
          # issue. Both audits always run, so one ecosystem's finding can't hide the other's.
          # pip-audit reads the installed environment, so the project is synced first, on
          # the base checkout too.
          setup: uv sync --locked
          command: |
            status=0
            bun audit || status=1
            uv run pip-audit || status=1
            exit "${status}"
          labels: dependencies
