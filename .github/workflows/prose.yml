# The two tiers markdownlint doesn't cover.
#
# Layout is Prettier and structure is markdownlint, both in the ci workflow.
# Those pass a document that reads badly: neither notices "an university",
# "the the", or a paragraph that has quietly gone passive.
#
# Mechanics and style are separate jobs on purpose. When this goes red the
# job name should say which tier failed, because a grammar mistake and a
# style opinion are answered differently — one is wrong, the other is a
# suggestion.
name: prose

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - .vale.ini
      - .ltex.json
      - styles/**
      - .github/workflows/prose.yml
  pull_request:
    paths:
      - "**/*.md"
      - .vale.ini
      - .ltex.json
      - styles/**
      - .github/workflows/prose.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prose-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned like everything else. Vale's style packages are versioned
  # separately and fetched by `vale sync`. No Go toolchain here to `go
  # install` it with, so this is a release binary instead.
  VALE_VERSION: v3.17.1
  # ltex-ls-plus is pinned inside scripts/lint-mechanics.sh and the
  # mechanics job's own container image instead, so the hook and this
  # workflow cannot install different versions of it.

jobs:
  # Mechanics: grammar, spelling, the phonetic article. These have a right
  # answer, so this one fails the build. ghcr.io/alrayyes/ltex-cli-plus
  # builds the ~300 MB tarball (its own JDK included) into an image once,
  # instead of this job fetching it fresh on every run.
  mechanics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/alrayyes/ltex-cli-plus:18.7.0@sha256:22452e86a130e528d526b60792926002983fcbf732bff09bd4e843d22816e4ea
      # ltex-cli-plus is the image's own entrypoint, which leaves no shell
      # for a step to run in - clearing it gets one back.
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the prose this repository owns
        # safe.directory: actions/checkout's own fix for this writes to a
        # temporary $HOME that only exists for the checkout step, so it
        # never reaches this later step's real $HOME in a container-as-root
        # job — without it, git ls-files below fails with "detected
        # dubious ownership", silently emptying the file list.
        #
        # The same script the pre-push hook runs, so the two cannot
        # disagree about the version, the file list or what counts as a
        # failure.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/lint-mechanics.sh

  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Vale
        run: |
          mkdir -p "$RUNNER_TEMP/vale"
          version=${VALE_VERSION#v}
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/${VALE_VERSION}/vale_${version}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/vale" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"

      - name: Vale
        # The same script the pre-push hook runs, so the two cannot check
        # different files or disagree about what's worth failing on.
        env:
          VALE_REPORT: vale.txt
        run: ./scripts/lint-prose.sh

      - name: Report
        if: always()
        run: |
          {
            echo '### Vale'
            echo
            if [ -s vale.txt ]; then
              echo '```'
              cat vale.txt
              echo '```'
            else
              echo 'Nothing to report.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
