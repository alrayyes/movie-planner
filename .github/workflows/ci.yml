# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more says so itself.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pinned like any other toolchain. The Python version itself comes
          # from .python-version, which setup-uv reads without being told to.
          version: "0.12.7"
      - name: uv sync
        # Frozen, so a drifted uv.lock fails the job rather than silently
        # resolving to something nobody committed.
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check
      - name: ruff format --check
        run: uv run ruff format --check
      - name: pyproject-fmt --check
        run: uv run pyproject-fmt --check pyproject.toml
      - name: mypy
        run: uv run mypy
      - name: bandit
        run: uv run bandit -q -r src/movie_planner
      - name: pip-audit
        run: uv run pip-audit

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pinned like any other toolchain. The Python version itself comes
          # from .python-version, which setup-uv reads without being told to.
          version: "0.12.7"
      - run: uv sync --frozen
      - name: pytest
        run: |
          uv run pytest --cov=movie_planner --cov-report=term-missing --cov-report=xml | tee coverage.txt
          {
            echo '### Coverage'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        # GitHub withholds repository secrets from a Dependabot-triggered
        # run, so CODECOV_TOKEN never resolves here and the tokenless
        # upload Codecov falls back to is refused outright on a protected
        # branch ("Token required because branch is protected") — not a
        # flake, and rebasing the PR doesn't change any of that.
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # Mutation testing: mutates src/ (excluding test_e2e.py's real-Baikal-
  # container coverage from the rerun set - ruinous to repeat per mutant,
  # see pyproject.toml's [tool.mutmut] comment) and reruns the rest of the
  # suite against each mutant. Non-blocking by design: `mutmut run` exits 0
  # regardless of survivor count, so this reports rather than gates - a
  # surviving mutant is a missing test case to pick up later, not a merge
  # blocker for a codebase that wasn't built mutation-clean from day one.
  mutmut:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - run: uv sync --frozen
      - name: mutmut run
        run: |
          uv run mutmut run
          {
            echo '### Mutation testing'
            echo
            echo '```'
            uv run mutmut results
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pinned like any other toolchain. The Python version itself comes
          # from .python-version, which setup-uv reads without being told to.
          version: "0.12.7"
      - name: uv build
        # Proves the wheel and sdist still build before anyone merges.
        # Nothing publishes them — this template doesn't wire a registry up;
        # a project stamped from it adds that the day it needs one.
        run: uv build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hadolint
        run: >
          docker run --rm -i
          hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e
          < Dockerfile
      - name: docker build
        # Proves the image still builds — hadolint only reads the Dockerfile
        # as text and can't catch that on its own. Not pushed here; the
        # release job publishes it to GHCR once a release actually cuts.
        run: docker build -t movie-planner:ci .

  # No release-job counterpart, unlike package-linux — a flake has
  # nothing to publish. `nix run github:alrayyes/movie-planner` (or
  # `nix profile install`) resolves the flake straight from whatever
  # commit is asked for; the commit itself is the distributable
  # artifact, so this only ever needs to prove the flake still builds.
  nix:
    runs-on: ubuntu-24.04
    # Cold cache rebuilds the whole dependency tree from source — 30+
    # minutes, confirmed live (see the Cache the Nix store step below) — so
    # this has to stay well above the warm-cache run time.
    timeout-minutes: 45
    # cache-nix-action's purge step needs this to delete its own stale
    # cache entries; everything else it does fits the default read scope.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Without this, every run rebuilds the whole dependency tree from
      # source from scratch — 30+ minutes, confirmed live — since none of
      # this flake's overridden derivations (uv-build compiled via cargo,
      # httpcore2/paramiko/caldav rebuilt because they depend on those
      # overrides) exist in nixpkgs' own binary cache. restore-prefixes
      # -all-matches (rather than -first-match) so a pull request can see
      # the cache a push to main already saved, not just its own branch's
      # — GitHub Actions caches are otherwise ref-isolated.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-all-matches: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P3D
          purge-primary-key: never
      - name: nix flake check
        run: nix flake check --print-build-logs
      - name: nix build
        run: nix build --print-build-logs
      - name: nix run
        run: nix run . -- --help

  # Dry run of the same build package-linux.yml's release-job call does,
  # against a fixed dev version — proves the .deb/.rpm still build and
  # actually install before a change to the Dockerfile's pyinstaller
  # stage, nfpm.yaml, or either script only gets exercised for real
  # against a tagged release.
  package-linux:
    uses: ./.github/workflows/package-linux.yml
    with:
      version: "0.0.0-dev"

  # Dry run of the AUR PKGBUILD, against a local source tarball built
  # from the current checkout rather than a real GitHub release — so
  # a PKGBUILD change gets exercised on every push/PR, not only for
  # real against a tagged release. makepkg refuses to run as root, so
  # this creates a build user the same way the release job's
  # container does.
  aur:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      # archlinux:latest ships no git at all. Confirmed live: with git
      # missing, actions/checkout falls back to downloading a tarball
      # via the GitHub REST API instead of a real clone — the checkout
      # succeeds, but the result has no .git directory, so `git
      # archive HEAD` two steps later fails with "not a git
      # repository". git has to be present before checkout runs, not
      # just before the steps that call it directly.
      - name: Bootstrap git for checkout
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tooling
        run: |
          pacman -Sy --noconfirm --needed \
            base-devel sudo man-db \
            python-build python-installer python-wheel python-uv-build \
            python-caldav python-httpx python-icalendar python-rapidfuzz python-typer
          # The archlinux image's own pacman.conf excludes man pages
          # from every install by default (an image-size optimization,
          # not real Arch behavior) — confirmed live: a package
          # correctly containing a man page still installed as if it
          # didn't, silently. Removed so the man-page check below is
          # actually meaningful.
          sed -i '/^NoExtract.*man/d' /etc/pacman.conf
          # actions/checkout's own dubious-ownership fix writes into a
          # temporary $HOME that only exists for that step — a
          # `container:` job running as root never sees it again in
          # later steps' real $HOME, so any git command from here on
          # (git archive below included) hits "detected dubious
          # ownership" without this.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
      - name: Build a local source tarball standing in for a GitHub release
        run: |
          mkdir -p /tmp/src
          git archive --prefix=movie-planner-movie-planner-v0.0.0/ \
            -o /tmp/src/movie-planner-0.0.0.tar.gz HEAD
          chmod -R a+rwX /tmp/src "$GITHUB_WORKSPACE"
      - name: Prepare a dev PKGBUILD pointing at that tarball
        run: |
          sed \
            -e "s/^pkgver=.*/pkgver=0.0.0/" \
            -e "s#^source=.*#source=(\"file:///tmp/src/movie-planner-0.0.0.tar.gz\")#" \
            -e "s/^sha256sums=.*/sha256sums=('SKIP')/" \
            PKGBUILD > /tmp/src/PKGBUILD
      - name: Install AUR-only build dependencies
        run: su builder -c "bash '$GITHUB_WORKSPACE/scripts/install-aur-builddeps.sh'"
      - name: makepkg
        run: su builder -c "cd /tmp/src && makepkg -s --noconfirm --nocheck"
      - name: Install and verify
        run: |
          pacman -U --noconfirm /tmp/src/movie-planner-0.0.0-1-any.pkg.tar.zst
          movie-planner --help
          man -w movie-planner

  # Layout and structure. Style and mechanics are prose.yml — see its header
  # comment for why they're split out.
  prose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        # Frozen, so a drifted lockfile fails the job rather than silently
        # resolving to something nobody committed.
        run: bun install --frozen-lockfile
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # A hook is something you can skip, and the version number depends on
  # these messages being right, so the whole branch is checked here too.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
