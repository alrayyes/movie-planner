[build-system]
build-backend = "uv_build"
# Range, not exact-pinned like every other dependency: this is uv's own
# generated build-backend compatibility range, not a runtime dependency of
# the project itself, and Renovate already watches it for updates.
requires = [ "uv-build>=0.12.5,<0.13" ]

[project]
name = "movie-planner"
version = "0.10.2"
description = "CLI that logs watched movies and syncs them to a CalDAV calendar"
readme = "README.md"
authors = [ { name = "alrayyes", email = "alrayyes@users.noreply.github.com" } ]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "caldav==3.2.1",
  "httpx==0.28.1",
  "icalendar==7.3",
  "questionary==2.1.1",
  "rapidfuzz==3.14.5",
  "typer==0.27.1",
]
scripts.movie-planner = "movie_planner:main"

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "click-man==0.5.1",
  "mutmut==3.7",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pyinstaller==6.22.2",
  "pyproject-fmt==2.28.1",
  "pytest==9.1.1",
  "pytest-cov==7.1",
  "ruff==0.16.5",
  "testcontainers==4.15",
]

[tool.ruff]
target-version = "py314"
line-length = 100
format.indent-style = "space"
format.quote-style = "double"
lint.select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.ignore = [
  "E501", # line too long (handled by the formatter)
]

[tool.mypy]
# tests/ isn't type-strict yet - scoped to src/ here and in every hook/CI
# invocation; see the follow-up issue for extending this to tests/.
files = [ "src" ]
python_version = "3.14"
strict = true

[tool.pytest]
ini_options.testpaths = [ "tests" ]

[tool.mutmut]
source_paths = [ "src" ]
# test_e2e.py spins up a real Baikal Docker container per module - fine
# once for the real suite, ruinous rerun per mutant. Everything it covers
# is also covered against FakeCalendar in test_cli.py/test_calendar_sync.py.
pytest_add_cli_args_test_selection = [ "--ignore=tests/test_e2e.py" ]
