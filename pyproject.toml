[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.5,<0.13" ]

[project]
name = "movie-planner"
version = "0.7.0"
description = "CLI that logs watched movies and syncs them to a CalDAV calendar"
readme = "README.md"
authors = [ { name = "alrayyes", email = "alrayyes@users.noreply.github.com" } ]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "caldav==3.2.1",
  "httpx==0.28.1",
  "icalendar==7.3",
  "questionary==2.1.1",
  "rapidfuzz==3.14.5",
  "typer==0.27.1",
]
scripts.movie-planner = "movie_planner:main"

[dependency-groups]
dev = [
  "click-man==0.5.1",
  "pip-audit==2.10.1",
  "pyinstaller==6.22.2",
  "pyproject-fmt==2.28.1",
  "pytest==9.1.1",
  "pytest-cov==7.1",
  "ruff==0.16.5",
  "testcontainers==4.15",
]

[tool.ruff]
target-version = "py314"
line-length = 100
format.indent-style = "space"
format.quote-style = "double"
lint.select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.ignore = [
  "E501", # line too long (handled by the formatter)
]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
